name: Quality and release gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22.12.0
  NPM_VERSION: 11.14.1

jobs:
  unit:
    name: Unit tests and coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Download freshly built WASM package
        uses: actions/download-artifact@v7
        with:
          name: wasm-package
          path: src/wasm/pkg

      - name: Run real WASM integration test
        run: npm run test:wasm:real

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  build:
    name: JS and WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Install dependencies
        run: npm ci

      - name: Build WASM and JavaScript artifacts
        run: npm run build

      - name: Verify runtime export contracts
        run: npm run check:types:runtime

      - name: Upload freshly built WASM package
        uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: src/wasm/pkg/
          if-no-files-found: error

  cargo:
    name: Cargo tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests with frozen dependencies
        run: cargo test --manifest-path src/wasm/Cargo.toml --locked

  e2e:
    name: Critical E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Download freshly built WASM package
        uses: actions/download-artifact@v7
        with:
          name: wasm-package
          path: src/wasm/pkg

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run critical browser journeys
        run: npm run test:e2e:ci

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            test-results/
            e2e/playwright-report/
          if-no-files-found: ignore

  performance:
    name: Performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Run performance gates
        run: npm run test:perf

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: tests/performance/.artifacts/perf-report.json
          if-no-files-found: warn

  package:
    name: Package size and consumer smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Download freshly built WASM package
        uses: actions/download-artifact@v7
        with:
          name: wasm-package
          path: src/wasm/pkg

      - name: Build JavaScript artifacts
        run: npm run build:js

      - name: Verify committed WASM package
        run: npm run build:wasm:verify

      - name: Enforce package contents and size
        run: npm run check:publish

      - name: Verify runtime and declaration exports
        run: npm run check:types:runtime

      - name: Create package tarball
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact"
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP/package-artifact")
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/package-artifact/$TARBALL" >> "$GITHUB_ENV"

      - name: Install and build empty Vue consumer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir package-consumer
          cd package-consumer
          npm init -y
          npm install "$PACKAGE_TARBALL" vue@^3.5.0 vite@^6.2.0 typescript@^5.8.0
          cp "$GITHUB_WORKSPACE/tests/types/entrypoints.ts" entrypoints.ts
          cp "$GITHUB_WORKSPACE/tests/types/tsconfig.json" tsconfig.json
          npx tsc -p tsconfig.json
          mkdir src
          cat > index.html <<'EOF'
          <div id="app"></div>
          <script type="module" src="/src/main.js"></script>
          EOF
          cat > src/main.js <<'EOF'
          import { createApp, h } from 'vue'
          import { TableDesigner, Workbook, SvgIcon } from 'vue-canvas-sheet'
          import { Workbook as CoreWorkbook } from 'vue-canvas-sheet/core'
          import { OffscreenRenderer } from 'vue-canvas-sheet/render'
          import 'vue-canvas-sheet/style.css'

          const workbook = new CoreWorkbook()
          if (typeof Workbook !== 'function' || !SvgIcon || typeof OffscreenRenderer !== 'function') {
            throw new TypeError('A documented package export is unavailable')
          }
          createApp({
            render: () => h(TableDesigner, {
              initialData: [['Name', 'Total'], ['Product A', { f: '=1+1' }]]
            })
          }).mount('#app')
          workbook.destroy()
          EOF
          npx vite build

  quality-gate:
    name: Required quality gate
    if: always()
    needs: [unit, build, cargo, e2e, performance, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CARGO_RESULT: ${{ needs.cargo.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          for result in "$UNIT_RESULT" "$BUILD_RESULT" "$CARGO_RESULT" "$E2E_RESULT" "$PERFORMANCE_RESULT" "$PACKAGE_RESULT"; do
            test "$result" = "success"
          done
