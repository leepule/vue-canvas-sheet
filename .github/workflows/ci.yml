name: Quality and release gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22.12.0
  NPM_VERSION: 11.14.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Run oxlint (warnings fail the build)
        run: npm run lint

  # 不等 build：单元测试用仓库里已提交的 src/wasm/pkg，新鲜 wasm 的集成测试在 build job 里跑。
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  build:
    name: JS and WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM and JavaScript artifacts
        run: npm run build

      - name: Run real WASM integration test
        run: npm run test:wasm:real

      - name: Verify runtime export contracts
        run: npm run check:types:runtime

      - name: Upload freshly built WASM package
        uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: src/wasm/pkg/
          if-no-files-found: error

  cargo:
    name: Cargo tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/wasm

      - name: Run Rust tests with frozen dependencies
        run: cargo test --manifest-path src/wasm/Cargo.toml --locked

  e2e:
    name: Critical E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Download freshly built WASM package
        uses: actions/download-artifact@v7
        with:
          name: wasm-package
          path: src/wasm/pkg

      # 命中缓存时 playwright install 跳过浏览器下载，只安装系统依赖。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run critical browser journeys
        run: npm run test:e2e:ci

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            test-results/
            e2e/playwright-report/
          if-no-files-found: ignore

  performance:
    name: Performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Run performance gates
        run: npm run test:perf

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: tests/performance/.artifacts/perf-report.json
          if-no-files-found: warn

  package:
    name: Package size and consumer smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Download freshly built WASM package
        uses: actions/download-artifact@v7
        with:
          name: wasm-package
          path: src/wasm/pkg

      - name: Build JavaScript artifacts
        run: npm run build:js

      - name: Verify committed WASM package
        run: npm run build:wasm:verify

      - name: Enforce package contents and size
        run: npm run check:publish

      - name: Verify runtime and declaration exports
        run: npm run check:types:runtime

      - name: Create package tarball
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact"
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP/package-artifact")
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/package-artifact/$TARBALL" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      # 空 Vue 项目安装 tarball、类型检查、构建，再用无头浏览器确认 formula / export Worker 没有降级到主线程。
      - name: Run consumer smoke test
        run: node scripts/consumer-smoke.mjs "$PACKAGE_TARBALL" "$RUNNER_TEMP/package-consumer"

  quality-gate:
    name: Required quality gate
    if: always()
    needs: [lint, unit, build, cargo, e2e, performance, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CARGO_RESULT: ${{ needs.cargo.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          for result in "$LINT_RESULT" "$UNIT_RESULT" "$BUILD_RESULT" "$CARGO_RESULT" "$E2E_RESULT" "$PERFORMANCE_RESULT" "$PACKAGE_RESULT"; do
            test "$result" = "success"
          done
