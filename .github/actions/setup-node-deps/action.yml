name: Setup Node and install dependencies
description: Checkout-independent Node setup with pinned npm and a clean `npm ci` install. Change NODE_VERSION / NPM_VERSION in the workflow env once and every job follows.

inputs:
  node-version:
    description: Node.js version to install
    required: true
  npm-version:
    description: npm version to pin globally
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Pin npm
      shell: bash
      run: npm install --global "npm@${NPM_VERSION}"
      env:
        NPM_VERSION: ${{ inputs.npm-version }}

    - name: Install dependencies
      shell: bash
      run: npm ci
